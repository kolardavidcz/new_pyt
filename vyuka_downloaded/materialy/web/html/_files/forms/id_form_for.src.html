<style>
	form { font-size: 20px; }
</style>

<form id="form">
  <fieldset>
    <legend><em>fieldset</em> umístěný ve &lt;form&gt;</legend>
      <label for="vstup">Text:</label>
      <input id="vstup" type="text" /><br />
      <input id="reset_button" type="reset" value="Reset" />
  </fieldset>
  <br />
  <label for="reset_button">Reset pomocí labelu „z dálky“</label>    
</form>

<fieldset>
  <legend><em>fieldset</em> umístěný mimo &lt;form&gt;</legend>
    <label for="external_button">Vynulování formuláře mimo &lt;form&gt;</label>
    <input form="form" id="external_button" type="reset" value="X" />
</fieldset>

<br />
<label>Úplně samostatný reset button, spojený s &lt;form&gt;</label>
<input form="form" id="alone_button" type="reset" value="X" />

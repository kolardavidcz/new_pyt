<form>
  <label>Zadejte číslo ležící mezi 5 a 20:</label>
  <input type="number" min="5" max="20" /><br />
  <input type="submit" />
</form>
<form>
  <label>Zadejte číslo ležící mezi 60 a 90:</label>
  0 <input id="range" type="range" min="60" max="90" onchange="output.value = range.value" /> 100
  <input id="output" type="text" onchange="range.value = output.value" /><br />
  <input type="submit" />
</form>
<form>
  <label>Zadejte datum ležící mezi 1. říjnem 2005 a 25. lednem 2008:</label>
  <input type="date" min="2005-10-01" max="2008-01-25" /><br />
  <input type="submit" />
</form>
<form>
  <label>Zadejte datum a čas ležící mezi 1. říjnem 2005, 8:00 a 25. lednem 2008, 23:30</label>
  <input type="datetime-local" min="2005-10-01T8:00" max="2008-01-25T23:30" /><br />
  <input type="submit" />
</form>
<form>
  <label>Zadejte měsíc a rok ležící mezi srpnem 2009 a lednem 2011:</label>
  <input type="month" min="2009-08" max="2011-01" /><br />
  <input type="submit" />
</form>
<form>
  <label>Zadejte čas ležící mezi devátou hodinou, dvacátou minutou, patnáctou sekundou a osmnáctou hodinou, sedmou minutou, třetí sekundou:</label>
  <input type="time" min="09:20:15" max="18:07:03" /><br />
  <input type="submit" />
</form>
<form>
  <label>Zadejte týden a rok ležící mezi 15. týdnem roku 2002 a 49. týdnem roku 2005:</label>
  <input type="week" min="2002-W15" max="2005-W49" /><br />
  <input type="submit" />
</form>

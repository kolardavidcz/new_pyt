<form>
  <fieldset>
    <legend>Sčítání</legend>
    <label>První číslo</label>
    <input id="a" type="number"&#10;           oninput="output.value = parseInt(a.value) + parseInt(b.value)" />
      +
    <label>druhé číslo</label>
    <input id="b" type="number"&#10;           oninput="output.value = parseInt(a.value) + parseInt(b.value)" />
      =
    <label>výstup: </label><br />
    <output id="output"></output>
    <br />
    <fieldset>
      <legend>Vnořený rámeček</legend>
      <label>
        Vynulování výpočtu
        <input type="reset" value="X" />
      </label>
    </fieldset>
  </fieldset>
  <fieldset disabled="disabled">
    <legend>Znepřístupněné prvky</legend>
    <input type="button" value="Na mě nemůžeš :)" />
  </fieldset>
</form>

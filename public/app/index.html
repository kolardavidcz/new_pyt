<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Python Course — C/Java → Python</title>
  <script>
    (function () {
      var t = localStorage.getItem("pcs-theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/app/css/tokens.css" />
  <link rel="stylesheet" href="/app/css/shell.css" />
  <link rel="stylesheet" href="/app/css/content.css" />
</head>
<body>
  <div id="app">
    <!-- Title bar -->
    <header class="titlebar" role="banner">
      <div class="titlebar-dots" aria-hidden="true">
        <span class="r"></span><span class="y"></span><span class="g"></span>
      </div>
      <div class="titlebar-title">
        <strong>python-course</strong>
        <span id="titlePath"> — C/Java → Python</span>
      </div>
      <div class="titlebar-actions">
        <button type="button" class="tb-btn" id="btnPrint" title="Print study plan / page (Ctrl+P)">Print 🖨</button>
        <button type="button" class="tb-btn" id="btnPalette" title="Command palette (Ctrl+K)">Ctrl+K</button>
        <button type="button" class="tb-btn" id="btnTheme" title="Toggle theme">Theme</button>
      </div>
    </header>

    <!-- Workbench -->
    <div class="workbench" id="workbench">
      <!-- Activity bar -->
      <nav class="activitybar" aria-label="Activity bar">
        <button type="button" class="activity-btn active" data-view="explorer" title="Explorer (Ctrl+Shift+E)" aria-label="Explorer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.2l1.6 1.8H19.5A1.5 1.5 0 0 1 21 8.3v9.2a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11z"/></svg>
        </button>
        <button type="button" class="activity-btn" data-view="progress" title="Study log (Deska & Statistika)" aria-label="Study log">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3-4 3 2 4-6"/></svg>
        </button>
        <div class="activity-spacer"></div>
        <button type="button" class="activity-btn" id="btnSidebarToggle" title="Toggle sidebar (Ctrl+B)" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16"/></svg>
        </button>
      </nav>

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar" aria-label="Sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title" id="sidebarTitle">Explorer</span>
          <div class="sidebar-actions">
            <button type="button" class="icon-btn" id="btnExpandAll" title="Expand all" aria-label="Expand all">
              <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 3h12v1H2zm0 4h12v1H2zm0 4h12v1H2z"/></svg>
            </button>
            <button type="button" class="icon-btn" id="btnCollapseAll" title="Collapse all" aria-label="Collapse all">
              <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 7h12v1H2z"/></svg>
            </button>
          </div>
        </div>

        <div class="filter-strip" id="filterStrip">
          <div class="filter-search">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
            <input type="search" id="filterText" placeholder="Filter weeks & topics…" autocomplete="off" spellcheck="false" />
          </div>
          <div class="filter-label">Tags</div>
          <div class="filter-row" id="tagChips" role="group" aria-label="Tag filters">
            <button type="button" class="chip" data-tag="Core">Core</button>
            <button type="button" class="chip" data-tag="WOW">WOW</button>
            <button type="button" class="chip" data-tag="Legendary">Legendary</button>
            <button type="button" class="chip" data-tag="Tricky">Tricky</button>
            <button type="button" class="chip" data-tag="Skip">Skip</button>
          </div>
          <div class="filter-label">Min. relevance</div>
          <div class="rel-control">
            <input type="range" id="relMin" min="1" max="10" value="1" />
            <span class="rel-val" id="relVal">≥ 1</span>
          </div>
          <div class="filter-label">Flavor</div>
          <div class="filter-row" id="flavorChips" role="group" aria-label="Flavor filters">
            <button type="button" class="chip" data-flavor="basics">basics</button>
            <button type="button" class="chip" data-flavor="resyntax">resyntax</button>
            <button type="button" class="chip" data-flavor="newconcept">newconcept</button>
            <button type="button" class="chip" data-flavor="pythonic">pythonic</button>
            <button type="button" class="chip" data-flavor="paradigm">paradigm</button>
          </div>
          <div class="filter-label">Sort</div>
          <select class="sort-select" id="sortBy" aria-label="Sort items">
            <option value="course">Course order</option>
            <option value="relevance-desc">Relevance ↓</option>
            <option value="relevance-asc">Relevance ↑</option>
            <option value="title">Title A–Z</option>
          </select>
        </div>

        <div class="tree-scroll" id="treeScroll">
          <div id="treeRoot" class="tree" role="tree" aria-label="Course explorer"></div>
          <div id="searchPanel" class="hidden" style="padding:8px 12px;color:var(--text-muted);font-size:12px;"></div>
          <div id="progressPanel" class="hidden" style="padding:12px;"></div>
        </div>
      </aside>

      <!-- Resize sash -->
      <div class="sash" id="sash" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>

      <!-- Editor -->
      <section class="editor-group" aria-label="Editor">
        <div class="tabbar" id="tabbar">
          <div class="tabs-scroll" id="tabsList" role="tablist"></div>
        </div>
        <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
        <div class="editor-body" id="editorBody">
          <div class="loading-bar" id="loadingBar"></div>
          <div id="main" class="state-panel">
            <h2>Loading course…</h2>
            <p>Fetching metadata and building the explorer.</p>
          </div>
        </div>
      </section>
    </div>

    <!-- Status bar -->
    <footer class="statusbar" role="contentinfo">
      <span class="sb-item" id="sbPath">python-course</span>
      <span class="sb-item" id="sbCounts">—</span>
      <div class="sb-right">
        <span class="sb-item" id="sbFilter">no filters</span>
        <button type="button" id="sbClearFilters" title="Clear all filters">Clear filters</button>
      </div>
    </footer>
  </div>

  <!-- Command palette -->
  <div class="palette-overlay" id="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette">
      <input type="text" class="palette-input" id="paletteInput" placeholder="Search lectures, exercises, weeks…" autocomplete="off" spellcheck="false" />
      <div class="palette-list" id="paletteList" role="listbox"></div>
    </div>
  </div>

  <script type="module" src="/app/js/app.js"></script>
</body>
</html>
